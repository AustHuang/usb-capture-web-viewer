<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USB Capture Snap V1.4</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI','Microsoft YaHei',sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#000;color:#edf2fb;overflow:hidden}#stage{position:fixed;inset:0;background:#000;overflow:hidden}#video{display:block;width:100%;height:100%;object-fit:contain;transform:scale(var(--zoom,1));transform-origin:center center}#video.cover{object-fit:cover}#video.fill{object-fit:fill}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#aab6c8;pointer-events:none}.empty h1{margin:0 0 10px;color:#fff;font-size:clamp(18px,3vw,26px)}.empty p{margin:5px;font-size:13px}.hidden{display:none!important}.top{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 10px;border-radius:9px;background:rgba(18,24,34,.96);border:1px solid #3d495a;box-shadow:0 8px 18px #0009}.hide-ui .top{display:none}.brand{font-size:14px;font-weight:750;margin-right:auto;white-space:nowrap}.brand small{color:#a2b7d0;font-weight:normal}.top label{font-size:12px;color:#bdc9db;display:flex;align-items:center;gap:5px;white-space:nowrap}select,button,input{font:inherit}select,button{background:#263348;color:#f0f5fb;border:1px solid #43546b;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12px}button:hover,select:hover{background:#344965}button.primary{background:#1767c5;border-color:#2477d5}input[type=range]{width:80px;accent-color:#49c4ff;cursor:pointer}.status{position:absolute;z-index:3;bottom:8px;left:8px;pointer-events:none;border-radius:6px;background:rgba(10,17,27,.8);font-size:11px;padding:6px 9px;color:#cad9ec}.hide-ui .status{display:none}.on{color:#62e0ad}.toast{position:absolute;z-index:8;top:58px;left:50%;transform:translateX(-50%);background:#7b2632;color:white;border-radius:8px;padding:9px 14px;font-size:13px;max-width:90%;display:none}.toast.show{display:block}@media(max-width:640px){.top{gap:5px}.brand{width:100%}select,button{padding:6px}.top label{font-size:11px}}
</style></head>
<body><div id="stage"><video id="video" autoplay muted playsinline></video><div class="empty" id="empty"><h1>USB Capture Viewer</h1><p>将鼠标移到画面顶部，选择采集设备并启动预览</p><p>此窗口支持 Win11 贴靠布局：Win + Z 或鼠标悬停最大化按钮</p></div><div class="toast" id="toast"></div><div class="top" id="top"><div class="brand">◉ USB Capture <small>V1.4 · Snap</small></div><label>设备 <select id="devices"><option value="">读取中…</option></select></label><label>分辨率 <select id="resolution"><option value="auto">自动</option><option value="1920x1080">1080P</option><option value="1280x720">720P</option><option value="640x480">480P</option></select></label><label>帧率 <select id="fps"><option value="60">60 FPS</option><option value="30">30 FPS</option><option value="auto">自动</option></select></label><button class="primary" id="start">启动预览</button><button id="stop">停止</button><label>画面 <select id="fit"><option value="contain">完整</option><option value="cover">裁剪铺满</option><option value="fill">拉伸铺满</option></select></label><label>缩放 <input id="zoom" type="range" min="100" max="220" step="5" value="100"><span id="zoomValue">100%</span></label><button id="reset">重置</button><button id="fullscreen">全屏</button></div><div class="status" id="status">未连接 · 鼠标触碰画面顶部打开控制栏</div></div>
<script>
'use strict';const $=id=>document.getElementById(id);const video=$('video'),stage=$('stage'),toolbar=$('top');let stream=null,toastTimer=null;
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),5500)}
function stop(){if(stream){for(const t of stream.getTracks())t.stop();stream=null}video.srcObject=null;$('empty').classList.remove('hidden');$('status').textContent='未连接 · 鼠标触碰画面顶部打开控制栏'}
async function enumerate(){if(!navigator.mediaDevices?.enumerateDevices){toast('无法读取视频设备。请使用 Chrome，并通过本地文件、localhost 或 HTTPS 打开。');return}try{const chosen=$('devices').value;const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');$('devices').replaceChildren();if(!devices.length){$('devices').add(new Option('无视频设备',''));return}devices.forEach((d,i)=>$('devices').add(new Option(d.label||`视频设备 ${i+1}`,d.deviceId)));if(devices.some(d=>d.deviceId===chosen))$('devices').value=chosen;else{const capture=devices.find(d=>/capture|usb video|hdmi|采集/i.test(d.label));if(capture)$('devices').value=capture.deviceId}}catch(e){toast('读取设备失败：'+e.message)}}
function info(){if(!stream)return;const t=stream.getVideoTracks()[0],s=t.getSettings();$('status').innerHTML='<span class="on">● LIVE</span> · '+escapeHtml(t.label||'USB Capture')+' · '+(s.width||video.videoWidth)+'×'+(s.height||video.videoHeight)+' · '+(s.frameRate?Math.round(s.frameRate)+' FPS':'FPS 未知')}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function start(){stop();if(!navigator.mediaDevices?.getUserMedia){toast('摄像头 API 不可用，请检查浏览器权限或访问来源。');return}const id=$('devices').value;const res=$('resolution').value;const wh=res==='auto'?null:res.split('x').map(Number);const fps=$('fps').value;const c={audio:false,video:{...(id?{deviceId:{ideal:id}}:{}),...(wh?{width:{ideal:wh[0]},height:{ideal:wh[1]}}:{}),...(fps==='auto'?{}:{frameRate:{ideal:Number(fps)}})}};try{stream=await navigator.mediaDevices.getUserMedia(c);video.srcObject=stream;await video.play();$('empty').classList.add('hidden');info();stream.getVideoTracks()[0].addEventListener('ended',()=>{stop();toast('视频设备已断开')});await enumerate();hide()}catch(e){stop();toast('启动失败：'+e.message+'；请检查摄像头授权以及是否被其他应用占用。')}}
function applyFit(){video.classList.remove('cover','fill');const mode=$('fit').value;if(mode==='cover'||mode==='fill')video.classList.add(mode)}
function applyZoom(){$('zoomValue').textContent=$('zoom').value+'%';video.style.setProperty('--zoom',String(Number($('zoom').value)/100))}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch(e){toast(e.message)}}
function show(){stage.classList.remove('hide-ui')}function hide(){if(stream)stage.classList.add('hide-ui')}
stage.addEventListener('mousemove',e=>{const r=toolbar.getBoundingClientRect();const trigger=e.clientY<=Math.max(22,stage.classList.contains('hide-ui')?34:r.bottom+6);if(trigger)show();else hide()});stage.addEventListener('mouseleave',hide);toolbar.addEventListener('mouseenter',show);toolbar.addEventListener('mouseleave',e=>{if(e.clientY>toolbar.getBoundingClientRect().bottom+4)hide()});
$('start').onclick=start;$('stop').onclick=stop;$('fit').onchange=applyFit;$('zoom').oninput=applyZoom;$('reset').onclick=()=>{$('fit').value='contain';$('zoom').value='100';applyFit();applyZoom()};$('fullscreen').onclick=full;video.ondblclick=full;document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!['INPUT','SELECT'].includes(document.activeElement.tagName))full()});navigator.mediaDevices?.addEventListener('devicechange',enumerate);video.addEventListener('loadedmetadata',info);window.addEventListener('beforeunload',stop);enumerate();
</script></body></html>
